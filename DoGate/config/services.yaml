# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'
            
    Symfony\Component\Config\FileLocator:
        class: App\Locator\CustomFileLocator
        arguments:
            $paths: '%kernel.project_dir%/config'
            
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments'
        ]
    app.json_authenticator:
        class: App\Security\JsonAuthenticator
        parent: lexik_jwt_authentication.security.jwt_authenticator

    acme_api.event.jwt_created_listener:
        class: App\Events\JWTCreatedListener
        arguments: [ '@request_stack' ]
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_created, method: onJWTCreated }

    acme_api.event.authentication_failure_listener:
        class: App\Events\AuthenticationFailureListener
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_failure, method: onAuthenticationFailureResponse }

    acme_api.event.authentication_success_listener:
        class: App\Events\AuthenticationSuccessListener
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_success, method: onAuthenticationSuccessResponse }
    
    acme_api.event.room_delete_listener:
        class: App\Events\RoomDeleteListener
        tags:
            - { name: doctrine.event_subscriber }

    acme_api.event.artist_video_post_listener:
        class: App\Events\ArtistVideoPostListener
        tags:
            - { name: doctrine.event_subscriber }

    acme_api.event.image_post_listener:
        class: App\Events\ImagePostListener
        tags:
            - { name: doctrine.event_subscriber }

    # acme_api.event.author_set_date_time_listener:
    #     class: App\Events\AuthorSetDateTimeListener
    #     tags:
    #         - { name: doctrine.event_subscriber }

    App\Namer\PostThumbnailNamer:
        public: true
        tags:
            - { name: vich_uploader.namer, mapping: post_thumbnail }

    App\Events\CompanyAccessSubscriber:
        tags:
            - { name: 'kernel.event_subscriber' }
    App\Events\CRUDListener:
        tags:
            - { name: 'kernel.event_subscriber' }

    # App\Doctrine\ProfilePictureActiveExtension:
    #     tags:
    #         - { name: api_platform.doctrine.orm.query_extension.collection }
    #         - { name: api_platform.doctrine.orm.query_extension.item }
    App\Controller\CustomImageController:
        tags: ['controller.service_arguments']
    App\Controller\PostController:
        tags: ['controller.service_arguments']
    App\Controller\UserCustomController:
        tags: ['controller.service_arguments']
    App\Filter\CompanyTypeTitleFilter:
        tags: ['api_platform.filter']
    App\Filter\CompanySizeFilter:
        tags: ['api_platform.filter']
    App\Filter\HotelFilter:
        tags: ['api_platform.filter']

    App\Serializer\CommentNormalizer:
        arguments: ['@serializer.normalizer.object'] # Utilisation d'un alias de service
        tags: ['serializer.normalizer']

    App\Serializer\AliasNormalizer:
        alias: 'serializer.normalizer.object'

    app.user_provider:
        class: App\Security\UserProvider
    
    
    
    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
