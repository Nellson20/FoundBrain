<VirtualHost 65.21.23.79:80 [2a01:4f9:3080:2967::2]:80>
    SuexecUserGroup "#1005" "#1005"
    ServerName real.gateafri.com
    ServerAlias www.real.gateafri.com
    ServerAlias mail.real.gateafri.com
    ServerAlias webmail.real.gateafri.com
    ServerAlias admin.real.gateafri.com
    

    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
    
    DocumentRoot /home/gateafri/domains/real.gateafri.com/public_html
    ErrorLog /var/log/virtualmin/real.gateafri.com_error_log
    CustomLog /var/log/virtualmin/real.gateafri.com_access_log combined
    ScriptAlias /cgi-bin/ /home/gateafri/domains/real.gateafri.com/cgi-bin/
    ScriptAlias /awstats/ /home/gateafri/domains/real.gateafri.com/cgi-bin/
    DirectoryIndex index.php index.php4 index.php5 index.htm index.html
    <Directory /home/gateafri/domains/real.gateafri.com/public_html>
        Options -Indexes +IncludesNOEXEC +SymLinksIfOwnerMatch 
        Require all granted
        AllowOverride All Options=ExecCGI,Includes,IncludesNOEXEC,Indexes,MultiViews,SymLinksIfOwnerMatch
    </Directory>
    <Directory /home/gateafri/domains/real.gateafri.com/cgi-bin>
        Require all granted
        AllowOverride All Options=ExecCGI,Includes,IncludesNOEXEC,Indexes,MultiViews,SymLinksIfOwnerMatch
    </Directory>
    ProxyPass /.well-known !
    RewriteEngine on
    RewriteCond %{HTTP_HOST} =webmail.real.gateafri.com
    RewriteRule ^(?!/.well-known)(.*) https://real.gateafri.com:20000/ [R]
    RewriteCond %{HTTP_HOST} =admin.real.gateafri.com
    RewriteRule ^(?!/.well-known)(.*) https://real.gateafri.com:10000/ [R]
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule .* "ws://127.0.0.1:5000%{REQUEST_URI}" [P,L]
    
    RemoveHandler .php
    RemoveHandler .php8.2
    <FilesMatch \.php$>
        SetHandler proxy:unix:/run/php/1711440368969752.sock|fcgi://127.0.0.1
    </FilesMatch>
    RewriteCond %{HTTPS} off
    RewriteRule ^/(?!.well-known)(.*)$ https://%{HTTP_HOST}/$1 [R]
    
    
    <Files awstats.pl>
        AuthName "real.gateafri.com statistics"
        AuthType Basic
        AuthUserFile /home/gateafri/domains/real.gateafri.com/.awstats-htpasswd
        require valid-user
    </Files>
    
</VirtualHost>
